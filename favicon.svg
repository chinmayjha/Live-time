<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#gradient)" stroke="none"/>
  
  <!-- Clock face -->
  <circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- Hour markers -->
  <g stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="15" x2="50" y2="20" transform="rotate(0 50 50)"/>
    <line x1="50" y1="15" x2="50" y2="20" transform="rotate(90 50 50)"/>
    <line x1="50" y1="15" x2="50" y2="20" transform="rotate(180 50 50)"/>
    <line x1="50" y1="15" x2="50" y2="20" transform="rotate(270 50 50)"/>
  </g>
  
  <!-- Clock hands -->
  <g stroke="white" stroke-linecap="round">
    <!-- Hour hand -->
    <line x1="50" y1="50" x2="50" y2="30" stroke-width="3" transform="rotate(45 50 50)"/>
    <!-- Minute hand -->
    <line x1="50" y1="50" x2="50" y2="25" stroke-width="2" transform="rotate(90 50 50)"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="white"/>
</svg>
