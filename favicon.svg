<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="clockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Clock face -->
  <circle cx="16" cy="16" r="15" fill="url(#clockGradient)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Clock hands -->
  <line x1="16" y1="16" x2="16" y2="7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="22" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#ffffff"/>
  
  <!-- Hour marks -->
  <circle cx="16" cy="4" r="1" fill="#ffffff"/>
  <circle cx="28" cy="16" r="1" fill="#ffffff"/>
  <circle cx="16" cy="28" r="1" fill="#ffffff"/>
  <circle cx="4" cy="16" r="1" fill="#ffffff"/>
</svg>
